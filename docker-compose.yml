name: ${PROJECT}

services:
  # HDFS Namenode
  namenode:
    build:
      context: .
      dockerfile: Dockerfile.namenode
    image: ${PROJECT}-namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - mapreduce-net

  # HDFS Datanodes
  datanode:
    build:
      context: .
      dockerfile: Dockerfile.datanode
    image: ${PROJECT}-datanode
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1g
    depends_on:
      - namenode
    networks:
      - mapreduce-net

  # Master Service
  master:
    build:
      context: .
      dockerfile: Dockerfile.master
    image: ${PROJECT}-master
    hostname: master
    ports:
      - "50051:50051"
    volumes:
      - ./jobs_executed:/app/jobs_executed
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      - namenode
    networks:
      - mapreduce-net

  # Worker Services (4 replicas, 1 CPU each per ProjectSpec.md)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ${PROJECT}-worker
    deploy:
      replicas: 4
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    depends_on:
      - master
      - namenode
    networks:
      - mapreduce-net

  # Plotter Service (for generating recovery metrics plots)
  plotter:
    build:
      context: .
      dockerfile: Dockerfile.plotter
    image: ${PROJECT}-plotter
    volumes:
      - ./jobs_executed:/app/jobs_executed
      - ./plots:/app/plots
    profiles:
      - tools
    networks:
      - mapreduce-net

networks:
  mapreduce-net:
    driver: bridge

