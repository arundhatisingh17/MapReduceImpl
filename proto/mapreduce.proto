syntax = "proto3";
package mapreduce;

message JobRequest {
  string input_path = 1;
  string output_path = 2;
  string user_code_path = 3;
  int32 num_map_tasks = 4;
  int32 num_reduce_tasks = 5;
}

message JobResponse {
  string job_id = 1;
  bool success = 2;
  string message = 3;
}

message JobStatusRequest {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  string status = 2;
  string message = 3;
}

service MapReduceService {
  rpc SubmitJob (JobRequest) returns (JobResponse);
  rpc GetJobStatus (JobStatusRequest) returns (JobStatusResponse);
}
