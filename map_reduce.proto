syntax = "proto3";

// ========== Job Types ==========
enum TaskType {
  MAP = 0;
  REDUCE = 1;
}

// ========== Client to Master Messages ==========
message SubmitJobRequest {
  string dataset_path = 1;
  int32 num_map_tasks = 2;
  int32 num_reduce_tasks = 3;
  string map_function_path = 4;
  string reduce_function_path = 5;
}

message JobStatusRequest {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  string status = 2;  // PENDING, MAP_IN_PROGRESS, REDUCE_IN_PROGRESS, COMPLETED, FAILED
  string output_path = 3;
  string error = 4;
}

// ========== Master to Worker Messages ==========
message WorkerRegistration {
  string worker_address = 1;
}

message RegistrationAck {
  bool success = 1;
  string message = 2;
}

message TaskAssignment {
  string task_id = 1;
  string job_id = 2;
  TaskType task_type = 3;
  string input_path = 4;
  string output_path = 5;
  string map_function_path = 6;
  string reduce_function_path = 7;
  int32 partition_id = 8;
  int32 num_reduce_tasks = 9;
}

message TaskResult {
  string task_id = 1;
  string worker_address = 2;
  bool success = 3;
  string error_message = 4;
  string output_path = 5;
}

message Heartbeat {
  string worker_address = 1;
  int64 timestamp = 2;
}

message HeartbeatAck {
  bool ok = 1;
}

// ========== Services ==========

// Master service - handles client job submissions and worker registration
service Master {
  rpc SubmitJob(SubmitJobRequest) returns (JobStatusResponse);
  rpc GetJobStatus(JobStatusRequest) returns (JobStatusResponse);
  rpc RegisterWorker(WorkerRegistration) returns (RegistrationAck);
}

// Worker service - handles task execution
service Worker {
  rpc ExecuteTask(TaskAssignment) returns (TaskResult);
  rpc SendHeartbeat(Heartbeat) returns (HeartbeatAck);
}
