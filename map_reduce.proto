syntax = "proto3";

message ScheduleJobRequest {
	string dataset_path = 1;
	string output_path = 2;
	int32 num_map_tasks = 3;
	int32 num_reduce_tasks = 4;
	string map_function_path = 5;
	string reduce_function_path = 6;
	double repartition_threshold = 7;
	string custom_hash_func = 8;
}

message GetJobStatusRequest {
	string job_id = 1;
}

message JobStatus {
        string job_id = 1;
	string status = 2;
	string output_path = 3;
	string err = 4;
}

service Scheduler {
	rpc SubmitJob(ScheduleJobRequest) returns (JobStatus);
	rpc GetJobStatus(GetJobStatusRequest) returns (JobStatus); 
}
